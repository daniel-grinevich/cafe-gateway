name: Deploy production

# Tag a commit on main with e.g. v1.4.0 to publish it. The production ArgoCD app is
# manual sync, so this only updates the manifest; sync it in the ArgoCD UI.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Only commits that landed on the default branch may be deployed.
      - name: Guard - tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          if ! git merge-base --is-ancestor "$commit" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_REF_NAME} ($commit) is not reachable from origin/${DEFAULT_BRANCH}"
            exit 1
          fi

      - name: Get short SHA
        id: sha
        run: echo "short-sha=$(git rev-parse --short=7 "${GITHUB_REF}^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod-latest
            type=raw,value=prod-${{ steps.sha.outputs.short-sha }}
            type=ref,event=tag

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cafe-gateway
          cache-to: type=gha,scope=cafe-gateway,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  update-manifests:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    env:
      NEW_TAG: ${{ needs.build-and-push-image.outputs.version }}
      OVERLAY: production/cafe-gateway/kustomization.yaml
    steps:
      - name: Checkout rainbow-road
        uses: actions/checkout@v6
        with:
          repository: daniel-grinevich/rainbow-road
          token: ${{ secrets.RAINBOW_ROAD_PAT }}

      # newTag sits on the line right after the image name in the overlay.
      - name: Update production image tag
        run: |
          [ -n "$NEW_TAG" ] || { echo "::error::empty image tag"; exit 1; }
          sed -i "\#name: ghcr.io/daniel-grinevich/cafe-gateway\$#{n;s/newTag: .*/newTag: ${NEW_TAG}/;}" "$OVERLAY"
          grep -A1 'name: ghcr.io/daniel-grinevich/cafe-gateway$' "$OVERLAY" | grep -q "newTag: ${NEW_TAG}$" \
            || { echo "::error::newTag not updated in $OVERLAY"; exit 1; }

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY"
          if git diff --cached --quiet; then
            echo "$OVERLAY already at $NEW_TAG"
            exit 0
          fi
          git commit -m "deploy cafe-gateway production: ${NEW_TAG}"
          # Other repos' deploys push to rainbow-road too; rebase and retry on a race.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt), rebasing"
            git pull --rebase
          done
          exit 1
