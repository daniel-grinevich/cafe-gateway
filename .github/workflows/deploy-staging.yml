name: Deploy staging

# Deploy by moving the single `staging` tag to a commit on main:
#   git tag -f staging <commit> && git push -f origin staging
on:
  push:
    tags:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      short-sha: ${{ steps.sha.outputs.short-sha }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Only commits that landed on the default branch may be deployed.
      - name: Guard - tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          if ! git merge-base --is-ancestor "$commit" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_REF_NAME} ($commit) is not reachable from origin/${DEFAULT_BRANCH}"
            exit 1
          fi

      - name: Get short SHA
        id: sha
        run: echo "short-sha=$(git rev-parse --short=7 "${GITHUB_REF}^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging-latest
            type=raw,value=staging-${{ steps.sha.outputs.short-sha }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cafe-gateway
          cache-to: type=gha,scope=cafe-gateway,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  update-manifests:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.build-and-push-image.outputs.short-sha }}
      OVERLAY: staging/cafe-gateway/kustomization.yaml
    steps:
      - name: Checkout rainbow-road
        uses: actions/checkout@v6
        with:
          repository: daniel-grinevich/rainbow-road
          token: ${{ secrets.RAINBOW_ROAD_PAT }}

      # Staging always runs staging-latest (imagePullPolicy: Always), so newTag never
      # changes. Bumping the pod-template annotation makes ArgoCD roll the pods onto
      # the image just pushed. The value is quoted: an all-digit sha would be a YAML int.
      - name: Bump deployed-sha annotation
        run: |
          [ -n "$SHA" ] || { echo "::error::empty sha"; exit 1; }
          grep -q 'navi.dev/deployed-sha:' "$OVERLAY" \
            || { echo "::error::no navi.dev/deployed-sha annotation in $OVERLAY"; exit 1; }
          sed -i -E "s#^([[:space:]]*navi\.dev/deployed-sha:).*#\1 \"${SHA}\"#" "$OVERLAY"
          if grep 'navi.dev/deployed-sha:' "$OVERLAY" | grep -vq "navi.dev/deployed-sha: \"${SHA}\"$"; then
            echo "::error::deployed-sha not updated in $OVERLAY"; exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY"
          if git diff --cached --quiet; then
            echo "$OVERLAY already at $SHA"
            exit 0
          fi
          git commit -m "deploy cafe-gateway staging: ${SHA}"
          # Other repos' deploys push to rainbow-road too; rebase and retry on a race.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt), rebasing"
            git pull --rebase
          done
          exit 1
